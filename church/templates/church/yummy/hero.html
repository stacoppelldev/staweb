{% load static %}

<style type="text/css">
  .hero h2 {
    font-size: 37px;
    font-family: var(--font-secondary);
  }
</style>

<section id="hero" class="hero d-flex align-items-center section-bg">
  <div class="container">
    <div class="row justify-content-between gy-5">
      <div class="col-lg-5 order-2 order-lg-1 d-flex flex-column justify-content-center
        align-items-center align-items-lg-start text-center text-lg-start">
        <h2 data-aos="fade-up">Welcome to Saint Alphonsa Catholic Church</h2>
        <p data-aos="fade-up" data-aos-delay="100">Come and Hear His words as we Worship and Praise</p>
      </div>

      <div class="col-lg-5 order-1 order-lg-2 text-center text-lg-start">
        <img src="{% static 'assets/img/logo/logo-sta.png' %}" class="img-fluid" alt="STA Logo"
          data-aos="zoom-out" data-aos-delay="300">
      </div>
    </div>
  </div>
</section>
