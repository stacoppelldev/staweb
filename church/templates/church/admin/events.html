{% extends "church/base2.html" %}
{% load static %}

{% block content %}
<br>
<br>
<br>
<br>
<br>

<main id="main">
  <section id="features" class="features">
    <div class="container">
      <div class="section-title" data-aos="fade-up">
        <h2>Events</h2>
        <a class="add-button" href="{% url 'add-event' %}">
          <i class="bx bx-plus"></i><span>Add</span>
        </a>
      </div>

      <div class="row">
        {% for event in events %}
        <div class="col-lg-4 mb-5 mb-lg-0" data-aos="fade-right">
          <ul class="nav nav-tabs flex-column">
            <li class="nav-item">
              <a class="nav-link active show marginTop5" href="/update-event/{{ event.id }}">
                <h4>{{ event.title }}</h4>
              </a>
            </li>
          </ul>
        </div>
        {% endfor %}
      </div>
    </div>
  </section>
</main>
{% endblock %}
