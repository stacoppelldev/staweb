{% extends "church/base2.html" %}
{% load static %}

{% block banner %}
<div id="bannerid" class="banner">
  {% for banner in banners %}
  <a class="banner-link" href="https://{{ banner.hyperlink }}" target="_blank">
    <p>{{ banner.message }}</p>
  </a>
  {% endfor %}
</div>
{% endblock %}

{% block content %}
<main id="main">
  {% if events %}
  <section id="steps" class="steps section-bg">
    <div class="container">
      <div class="section-title" data-aos="fade-up">
        <h2>Upcoming Events</h2>
      </div>

      <div class="text-center">
        <a href="{% url 'calendar' %}" class="btn btn-outline-info">View Full Calendar</a>
      </div>
    </div>
  </section>
  {% endif %}
</main>
{% endblock %}
