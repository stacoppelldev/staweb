{% extends "church/base2.html" %}
{% load static %}

{% block content %}
<br>
<br>
<br>

<main id="main">
  <section id="features" class="features">
    <div class="container">
      <div class="section-title" data-aos="fade-up">
        <h2>Announcements</h2>
      </div>

      <div class="row">
        {% for announcements in announcement %}
        <div class="col-lg-4 mb-3" data-aos="fade-right">
          <ul class="nav nav-tabs flex-column">
            <li class="nav-item">
              <a class="nav-link active show marginTop5" href="/announcementDetails/{{ announcements.id }}">
                <h4>{{ announcements.message }}</h4>
              </a>
            </li>
          </ul>
        </div>
        {% endfor %}
      </div>
    </div>
  </section>
</main>
{% endblock %}
